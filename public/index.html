<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>Explora los Pokémon de PokeAPI</p>
    </header>

    <main>

        <div id="pokemon-container" class="pokemon-grid">
            <!-- Los Pokémon aparecerán aquí -->
        </div>

        <div class="pagination">

            <button id="previousBtn">
                ← Anteriores
            </button>

            <span id="pageInfo">
                Página 1
            </span>

            <button id="nextBtn">
                Siguientes →
            </button>

        </div>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
